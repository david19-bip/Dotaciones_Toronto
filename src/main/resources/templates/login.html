<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dotaciones Toronto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
           body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url('/images/fondo login.jpg');  background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    .login-card {
        background: rgba(255, 255, 255, 0.92);
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.25);
        padding: 40px 36px;
        width: 100%;
        max-width: 420px;
    }
    .login-icon { font-size: 3rem; color: #0d6efd; }
    .login-title { font-size: 1.6rem; font-weight: 700; color: #212529; }
    .login-subtitle { color: #6c757d; font-size: 0.9rem; margin-bottom: 24px; }
    .form-control {
        border-radius: 8px;
        padding: 10px 14px;
        border: 1.5px solid #dee2e6;
    }
    .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 3px rgba(13,110,253,0.10);
    }
    .btn-login {
        border-radius: 8px;
        padding: 11px;
        font-weight: 600;
        font-size: 1rem;
    }
    .footer-text { color: #adb5bd; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-3">
            <i class="bi bi-buildings login-icon"></i>
            <div class="login-title mt-2">Dotaciones Toronto</div>
            <div class="login-subtitle">Inicia sesión para continuar</div>
        </div>

        <div th:if="${param.error}" class="alert alert-danger p-2 fs-6">
            Correo o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-info p-2 fs-6">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Correo electrónico</label>
                <input type="email" name="username" class="form-control"
                       placeholder="correo@ejemplo.com" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" name="password" class="form-control"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/registro" class="text-decoration-none text-secondary" style="font-size:0.9rem;">
                ¿No tienes cuenta? Regístrate
            </a>
        </div>
        <div class="text-center mt-3 footer-text">© Dotaciones Toronto 2026</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
