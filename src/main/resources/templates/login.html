<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dotaciones Toronto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/login.css}" rel="stylesheet">
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-3">
            <img th:src="@{/images/logo negro.png}" alt="Logo Dotaciones Toronto" class="login-icon" style="width: 100px; height: 100px; object-fit: contain;">
            <div class="login-title mt-2">Dotaciones Toronto</div>
            <div class="login-subtitle">Inicia sesión para continuar</div>
        </div>

        <div th:if="${param.error}" class="alert alert-danger p-2 fs-6">
            Correo o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-info p-2 fs-6">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Correo electrónico</label>
                <input type="email" name="username" class="form-control"
                       placeholder="correo@ejemplo.com" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" name="password" class="form-control"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
            </button>
        </form>

        <div class="text-center mt-3">
        <a href="/registro" class="text-decoration-none text-secondary" style="font-size:0.9rem;">
            ¿No tienes cuenta? Regístrate
        </a>
        </div>
        <div class="text-center mt-3 footer-text">© Dotaciones Toronto 2026</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
