<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OdontoClinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow border-0 rounded-3">
                    <div class="card-body p-4 text-center">
                        <i class="bi bi-hospital fs-1 text-primary mb-2"></i>
                        <h3 class="fw-bold text-primary mb-4">OdontoClinic</h3>

                        <div th:if="${param.error}" class="alert alert-danger p-2 fs-6">
                            Correo o contraseña incorrectos.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success p-2 fs-6">
                            Has cerrado sesión correctamente.
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3 text-start">
                                <label class="form-label fw-semibold">Nombre</label>
                                <input type="text"name="nombre" class="from-control" placeholder="Ingrese su nombre" required autofocus>
                            </div>
                            <div class="mb-4 text-start">
                                <label class="form-label fw-semibold">Documento</label>
                                <input type="text" name="documento" class="from-control" placeholder="Ingrese su documento" required>
                            </div>
                            <div class="mb-4 text-start">
                                <label class="form-label fw-semibold">Correo Electrónico</label>
                                <input type="email" name="username" class="from-control" placeholder="Ingresa su correo electrónico"required>
                            </div>
                            <div class="mb-4 text-start">
                                <label class="form-label fw-semibold">Teléfono</label>
                                <input type="text" name="telefono" class="from-control" placeholder="Ingrese su teléfono" required>
                            </div>
                            <div class="mb-4 text-start">
                                <label class="form-label fw-semibold">Dirreccion</label>
                                <input type="text" name="direccion" class="from-control" placeholder="Ingrese tu direccion" required>
                            </div>
                            <div class="mb-4 text-start">
                                <label class="form-label fw-semibold">Contraseña</label>
                                <input type="password" name="password" class="from-control" placeholder="Ingrese su contraseña" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
