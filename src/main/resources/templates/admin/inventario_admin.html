<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Dotaciones Toronto</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Estilo unificado del Admin -->
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>

    <!-- Sidebar Administrador -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <img th:src="@{/images/logo blanco.png}" 
                 alt="Logo Dotaciones Toronto" 
                 style="width: 140px; height: auto; object-fit: contain; display: block; margin: 0 auto 8px;">
            <div style="color: #ffffff; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.5px; text-align: center;">
                Dotaciones Toronto
            </div>
            <span class="role-badge">
                <i class="bi bi-shield-lock-fill me-1"></i> Administrador
            </span>
        </div>

        <a href="/admin/panel"><i class="bi bi-speedometer2"></i> Inicio</a>
        <a href="/admin/perfil"><i class="bi bi-person-circle"></i> Perfil</a>
        <a href="/admin/usuarios"><i class="bi bi-people"></i> Usuarios</a>
        <a href="/admin/productos"><i class="bi bi-box-seam"></i> Productos</a>
        <a href="/admin/inventario" class="active"><i class="bi bi-archive"></i> Inventario</a>
        <a href="/admin/pedidos"><i class="bi bi-bag-check"></i> Pedidos</a>
        <a href="/admin/devoluciones"><i class="bi bi-arrow-return-left"></i> Devoluciones</a>
        
        <div style="padding: 15px 24px; margin-top: auto;">
            <form th:action="@{/logout}" method="post">
                <button type="submit">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
                </button>
            </form>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-1">Gestión de Inventario</h3>
                <p class="text-muted mb-0">Bienvenido, <span class="fw-semibold text-dark" th:text="${nombre}"></span></p>
            </div>
            <button class="btn btn-admin shadow-sm" data-bs-toggle="modal" data-bs-target="#modalCrearInventario">
                <i class="bi bi-plus-circle-fill me-1"></i> Agregar Inventario
            </button>
        </div>

        <!-- Alertas -->
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show p-3 mb-4" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show p-3 mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Tabla de inventario en tarjeta Glass -->
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0 overflow-hidden" style="border-radius: 14px;">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="p-3 ps-4"># ID</th>
                                <th class="p-3">Producto (ID)</th>
                                <th class="p-3 text-center">Cantidad Actual</th>
                                <th class="p-3 text-center">Stock Mínimo</th>
                                <th class="p-3 text-center">Estado</th>
                                <th class="p-3 text-end pe-4">Actualizar Stock</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(inventarios)}">
                                <td colspan="6" class="text-center p-4 text-muted">No hay registros de inventario.</td>
                            </tr>
                            <tr th:each="inv : ${inventarios}">
                                <td class="p-3 ps-4 fw-bold text-secondary" th:text="${'#' + inv.id}">#1</td>
                                <td class="p-3 fw-semibold text-dark" th:text="${inv.idProducto}">ID Producto</td>
                                <td class="p-3 text-center fw-bold fs-6 text-dark" th:text="${inv.cantidadActual}">0</td>
                                <td class="p-3 text-center text-muted" th:text="${inv.stockMinimo}">0</td>
                                <td class="p-3 text-center">
                                    <span th:class="${'badge ' + (inv.cantidadActual <= inv.stockMinimo ? 'bg-danger' : 'bg-success')}"
                                          th:text="${inv.cantidadActual <= inv.stockMinimo ? 'Stock bajo' : 'Normal'}">
                                    </span>
                                </td>
                                <td class="p-3 text-end pe-4">
                                    <form th:action="@{/admin/inventario/actualizar}" method="post" class="d-inline-flex gap-2 align-items-center justify-content-end">
                                        <input type="hidden" name="idInventario" th:value="${inv.id}">
                                        <input type="number" name="cantidadActual" class="form-control form-control-sm text-center"
                                               th:value="${inv.cantidadActual}" style="width: 85px;" min="0" required>
                                        <button type="submit" class="btn btn-sm btn-outline-primary" title="Guardar cambios">
                                            <i class="bi bi-arrow-repeat"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Agregar Inventario -->
    <div class="modal fade" id="modalCrearInventario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 pb-0 pt-4 px-4">
                    <h5 class="modal-title fw-bold text-dark"><i class="bi bi-archive me-2 text-primary"></i>Agregar Inventario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form th:action="@{/admin/inventario/crear}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Producto</label>
                            <select name="idProducto" class="form-select" required>
                                <option value="" disabled selected>Seleccione un producto</option>
                                <option th:each="producto : ${productos}"
                                        th:value="${producto.id}"
                                        th:text="${producto.nombre + ' - Talla: ' + producto.talla + ' - Color: ' + producto.color}">
                                </option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-semibold small text-secondary">Cantidad Actual</label>
                                <input type="number" name="cantidadActual" class="form-control"
                                       placeholder="Ej: 50" min="0" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-semibold small text-secondary">Stock Mínimo</label>
                                <input type="number" name="stockMinimo" class="form-control"
                                       placeholder="Ej: 5" min="0" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-admin w-100 fw-semibold py-2">
                            <i class="bi bi-save me-1"></i> Agregar al Inventario
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
