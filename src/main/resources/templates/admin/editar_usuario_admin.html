<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario - Dotaciones Toronto</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Estilo unificado del Admin -->
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>

    <!-- Sidebar Administrador -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <img th:src="@{/images/logo blanco.png}" 
                 alt="Logo Dotaciones Toronto" 
                 style="width: 140px; height: auto; object-fit: contain; display: block; margin: 0 auto 8px;">
            <div style="color: #ffffff; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.5px; text-align: center;">
                Dotaciones Toronto
            </div>
            <span class="role-badge">
                <i class="bi bi-shield-lock-fill me-1"></i> Administrador
            </span>
        </div>

        <a href="/admin/panel"><i class="bi bi-speedometer2"></i> Inicio</a>
        <a href="/admin/perfil"><i class="bi bi-person-circle"></i> Perfil</a>
        <a href="/admin/usuarios" class="active"><i class="bi bi-people"></i> Usuarios</a>
        <a href="/admin/productos"><i class="bi bi-box-seam"></i> Productos</a>
        <a href="/admin/inventario"><i class="bi bi-archive"></i> Inventario</a>
        <a href="/admin/pedidos"><i class="bi bi-bag-check"></i> Pedidos</a>
        <a href="/admin/devoluciones"><i class="bi bi-arrow-return-left"></i> Devoluciones</a>
        
        <div style="padding: 15px 24px; margin-top: auto;">
            <form th:action="@{/logout}" method="post">
                <button type="submit">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
                </button>
            </form>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-1">Editar Usuario</h3>
                <p class="text-muted mb-0">Modifica la información de la cuenta seleccionada</p>
            </div>
            <a href="/admin/usuarios" class="btn btn-outline-secondary shadow-sm">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="card border-0 shadow-sm rounded-4" style="max-width: 800px;">
            <div class="card-body p-4">
                <form th:action="@{/admin/usuarios/actualizar}" method="post" th:object="${usuario}">
                    <input type="hidden" name="idUsuario" th:value="*{id}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Nombre Completo</label>
                        <input type="text" name="nombre" class="form-control" th:value="*{nombre}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold small text-secondary">Documento</label>
                            <input type="text" name="documento" class="form-control" th:value="*{documento}" pattern="[0-9]+" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold small text-secondary">Teléfono</label>
                            <input type="text" name="telefono" class="form-control" th:value="*{telefono}" pattern="[0-9]+" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Correo Electrónico</label>
                        <input type="email" name="correo" class="form-control" th:value="*{correo}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Dirección</label>
                        <input type="text" name="direccion" class="form-control" th:value="*{direccion}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-secondary">Rol asignado</label>
                        <select name="rol" class="form-select" required>
                            <option value="2" th:selected="*{idRol == 2}">Cliente</option>
                            <option value="3" th:selected="*{idRol == 3}">Vendedor</option>
                            <option value="4" th:selected="*{idRol == 4}">Bodeguero</option>
                            <option value="1" th:selected="*{idRol == 1}">Administrador</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/admin/usuarios" class="btn btn-light px-4 py-2 fw-semibold">Cancelar</a>
                        <button type="submit" class="btn btn-admin px-4 py-2 fw-semibold">
                            <i class="bi bi-save me-1"></i> Actualizar Usuario
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
