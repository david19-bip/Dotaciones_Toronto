<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario - Dotaciones Toronto</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Estilo unificado del Admin -->
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>

    <!-- Sidebar Administrador -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <img th:src="@{/images/logo blanco.png}" 
                 alt="Logo Dotaciones Toronto" 
                 style="width: 140px; height: auto; object-fit: contain; display: block; margin: 0 auto 8px;">
            <div style="color: #ffffff; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.5px; text-align: center;">
                Dotaciones Toronto
            </div>
            <span class="role-badge">
                <i class="bi bi-shield-lock-fill me-1"></i> Administrador
            </span>
        </div>

        <a href="/admin/panel"><i class="bi bi-speedometer2"></i> Inicio</a>
        <a href="/admin/perfil"><i class="bi bi-person-circle"></i> Perfil</a>
        <a href="/admin/usuarios" class="active"><i class="bi bi-people"></i> Usuarios</a>
        <a href="/admin/productos"><i class="bi bi-box-seam"></i> Productos</a>
        <a href="/admin/inventario"><i class="bi bi-archive"></i> Inventario</a>
        <a href="/admin/pedidos"><i class="bi bi-bag-check"></i> Pedidos</a>
        <a href="/admin/devoluciones"><i class="bi bi-arrow-return-left"></i> Devoluciones</a>
        
        <div style="padding: 15px 24px; margin-top: auto;">
            <form th:action="@{/logout}" method="post">
                <button type="submit">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
                </button>
            </form>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-1">Editar Usuario</h3>
                <p class="text-muted mb-0">Modifica la información de la cuenta seleccionada</p>
            </div>
            <a href="/admin/usuarios" class="btn btn-outline-secondary shadow-sm">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="card border-0 shadow-sm rounded-4" style="max-width: 800px;">
            <div class="card-body p-4">
                <form th:action="@{/admin/usuarios/actualizar}" method="post" th:object="${usuario}" id="formEditarUsuario" novalidate>
                    <input type="hidden" name="idUsuario" th:value="*{id}">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold small text-secondary">Teléfono</label>
                            <input type="text" name="telefono" id="editTelefono" class="form-control" th:value="*{telefono}" pattern="[0-9]+" minlength="7" maxlength="15" required>
                            <div class="invalid-feedback">Entre 7 y 15 dígitos.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold small text-secondary">Correo Electrónico</label>
                            <input type="email" name="correo" id="editCorreo" class="form-control" th:value="*{correo}" required>
                            <div class="invalid-feedback">Ingrese un correo válido.</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Dirección</label>
                        <input type="text" name="direccion" id="editDireccion" class="form-control" th:value="*{direccion}" minlength="5" required>
                        <div class="invalid-feedback">Mínimo 5 caracteres.</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-secondary">Rol asignado</label>
                        <select name="rol" id="editRol" class="form-select" required>
                            <option value="2" th:selected="*{idRol == 2}">Cliente</option>
                            <option value="3" th:selected="*{idRol == 3}">Vendedor</option>
                            <option value="4" th:selected="*{idRol == 4}">Bodeguero</option>
                            <option value="1" th:selected="*{idRol == 1}">Administrador</option>
                        </select>
                        <div class="invalid-feedback">Seleccione un rol.</div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/admin/usuarios" class="btn btn-light px-4 py-2 fw-semibold">Cancelar</a>
                        <button type="submit" class="btn btn-admin px-4 py-2 fw-semibold">
                            <i class="bi bi-save me-1"></i> Actualizar Usuario
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de Validaciones en Tiempo Real -->
    <script>
        document.getElementById('editTelefono').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            validarCampo(this);
        });
        document.getElementById('editCorreo').addEventListener('input', function() {
            validarCampo(this);
        });
        document.getElementById('editDireccion').addEventListener('input', function() {
            validarCampo(this);
        });
        document.getElementById('editRol').addEventListener('change', function() {
            validarCampo(this);
        });

        function validarCampo(campo) {
            if (campo.checkValidity()) {
                campo.classList.remove('is-invalid');
                campo.classList.add('is-valid');
            } else {
                campo.classList.remove('is-valid');
                campo.classList.add('is-invalid');
            }
        }

        document.getElementById('formEditarUsuario').addEventListener('submit', function(e) {
            let valido = true;
            this.querySelectorAll('input, select').forEach(function(campo) {
                validarCampo(campo);
                if (!campo.checkValidity()) valido = false;
            });
            if (!valido) {
                e.preventDefault();
                e.stopPropagation();
            }
        });
    </script>
</body>
</html>
