<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Dotaciones Toronto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-buildings me-2"></i>Dotaciones Toronto
        </div>
        <a href="/admin/panel"><i class="bi bi-house"></i> Inicio</a>
        <a href="/admin/usuarios"><i class="bi bi-people"></i> Usuarios</a>
        <a href="/admin/productos" class="active"><i class="bi bi-box"></i> Productos</a>
        <a href="/admin/inventario"><i class="bi bi-archive"></i> Inventario</a>
        <a href="/admin/pedidos"><i class="bi bi-bag"></i> Pedidos</a>
        <a href="/admin/devoluciones"><i class="bi bi-arrow-return-left"></i> Devoluciones</a>
        <form th:action="@{/logout}" method="post" style="padding: 10px 20px; margin-top: 10px;">
            <button type="submit" style="background:none; border:none; color:#f87171; cursor:pointer; font-size:0.9rem; padding:0;">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </button>
        </form>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold text-dark mb-1">Gestión de Productos</h4>
                <p class="text-muted mb-0">Administra el catálogo de productos</p>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCrearProducto">
                <i class="bi bi-plus-circle me-1"></i> Nuevo Producto
            </button>
        </div>

        <!-- Alertas -->
        <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Tabla de productos -->
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead style="background: linear-gradient(90deg, #1a1a2e, #0f3460); color:#e2b96f;">
                        <tr>
                            <th class="p-3"># ID</th>
                            <th class="p-3">Nombre</th>
                            <th class="p-3">Precio</th>
                            <th class="p-3">Talla</th>
                            <th class="p-3">Color</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="7" class="text-center p-4 text-muted">No hay productos registrados</td>
                        </tr>
                        <tr th:each="producto : ${productos}">
                            <td class="p-3 fw-bold" th:text="${producto.id}"></td>
                            <td class="p-3" th:text="${producto.nombre}"></td>
                            <td class="p-3 fw-bold text-success">
                                $<span th:text="${#numbers.formatDecimal(producto.precio, 1, 'COMMA', 0, 'POINT')}"></span>
                            </td>
                            <td class="p-3" th:text="${producto.talla}"></td>
                            <td class="p-3" th:text="${producto.color}"></td>
                            <td class="p-3">
                                <span th:class="${'badge ' + (producto.estado == 'Disponible' ? 'bg-success' : 'bg-danger')}"
                                      th:text="${producto.estado}"></span>
                            </td>
                            <td class="p-3 d-flex gap-2">
                                <form th:action="@{/admin/productos/toggleEstado}" method="post">
                                    <input type="hidden" name="idProducto" th:value="${producto.id}">
                                    <button type="submit"
                                        th:class="${'btn btn-sm ' + (producto.estado == 'Disponible' ? 'btn-warning' : 'btn-success')}"
                                        th:text="${producto.estado == 'Disponible' ? 'Agotado' : 'Disponible'}">
                                    </button>
                                </form>
                                <form th:action="@{/admin/productos/eliminar}" method="post"
                                      onsubmit="return confirm('¿Eliminar este producto?')">
                                    <input type="hidden" name="idProducto" th:value="${producto.id}">
                                    <button type="submit" class="btn btn-sm btn-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Crear Producto -->
    <div class="modal fade" id="modalCrearProducto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(90deg, #1a1a2e, #0f3460);">
                    <h5 class="modal-title text-white"><i class="bi bi-plus-circle me-2"></i>Nuevo Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/admin/productos/crear}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input type="text" name="nombre" class="form-control" placeholder="Nombre del producto" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Precio</label>
                            <input type="number" name="precio" class="form-control" placeholder="Precio" min="0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Talla</label>
                            <select name="talla" class="form-control" required>
                                <option value="">Seleccione talla</option>
                                <option value="XS">XS</option>
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                                <option value="XXL">XXL</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Color</label>
                            <input type="text" name="color" class="form-control" placeholder="Color" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-semibold">
                            <i class="bi bi-plus-circle me-1"></i> Crear Producto
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
