<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Dotaciones Toronto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/registro.css}" rel="stylesheet">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar-dt">
        <div class="container">
            <a href="/" class="navbar-brand">
                <img th:src="@{/images/logo negro.png}" alt="Logo">
                <span>Dotaciones Toronto</span>
            </a>
            <div class="navbar-actions">
                <a href="/" class="btn-ghost">Inicio</a>
                <a href="/login" class="btn-ghost">Iniciar sesión</a>
                <a href="/registro" class="btn-primary-dt">Registrarse</a>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="page-content">
        <div class="login-card">
            <div class="text-center mb-3">
                <img th:src="@{/images/logo negro.png}" alt="Logo" class="registro-logo">
                <div class="login-title mt-1">Dotaciones Toronto</div>
                <div class="login-subtitle">Crear nueva cuenta</div>
            </div>

            <div th:if="${error}" class="alert alert-danger py-2 px-3 fs-6 mb-3" th:text="${error}"></div>
            <div th:if="${exito}" class="alert alert-success py-2 px-3 fs-6 mb-3" th:text="${exito}"></div>

            <form th:action="@{/registro}" method="post" novalidate id="formRegistro">

                <!-- Fila 1: Nombre y Documento -->
                <div class="row g-3 mb-2">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nombre</label>
                        <input type="text" name="nombre" id="nombre" class="form-control"
                               placeholder="Su nombre"
                               pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+"
                               title="Solo letras"
                               minlength="3"
                               required autofocus>
                        <div class="invalid-feedback">Mínimo 3 letras.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Documento</label>
                        <input type="text" name="documento" id="documento" class="form-control"
                               placeholder="Núm. de documento"
                               pattern="[0-9]+"
                               minlength="6"
                               maxlength="15"
                               required>
                        <div class="invalid-feedback">Entre 6 y 15 dígitos.</div>
                    </div>
                </div>

                <!-- Fila 2: Correo y Teléfono -->
                <div class="row g-3 mb-2">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Correo electrónico</label>
                        <input type="email" name="correo" id="correo" class="form-control"
                               placeholder="correo@ejemplo.com"
                               required>
                        <div class="invalid-feedback">Correo inválido.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Teléfono</label>
                        <input type="text" name="telefono" id="telefono" class="form-control"
                               placeholder="Número telefónico"
                               pattern="[0-9]+"
                               minlength="7"
                               maxlength="15"
                               required>
                        <div class="invalid-feedback">Entre 7 y 15 dígitos.</div>
                    </div>
                </div>

                <!-- Fila 3: Dirección -->
                <div class="mb-2">
                    <label class="form-label fw-semibold">Dirección</label>
                    <input type="text" name="direccion" id="direccion" class="form-control"
                           placeholder="Dirección de residencia"
                           minlength="5"
                           required>
                    <div class="invalid-feedback">Mínimo 5 caracteres.</div>
                </div>

                <!-- Fila 4: Contraseña y Rol -->
                <div class="row g-3 mb-4">
                    <div class="col-12">
                        <label class="form-label fw-semibold">Contraseña</label>
                        <div class="input-group">
                            <input type="password" name="password" id="password" class="form-control"
                                   placeholder="••••••••" required minlength="6">
                            <button type="button" class="btn btn-outline-secondary" id="togglePassword">
                                <i class="bi bi-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback">Mínimo 6 caracteres.</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Rol</label>
                        <select name="rol" id="rol" class="form-control form-select" required>
                            <option value="">Seleccione rol</option>
                            <option value="2">Cliente</option>
                            <option value="3">Vendedor</option>
                            <option value="4">Bodeguero</option>
                            <option value="1">Admin</option>
                        </select>
                        <div class="invalid-feedback">Seleccione un rol.</div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-login w-100">
                    <i class="bi bi-person-plus me-1"></i> Registrarse
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none text-secondary" style="font-size:0.88rem;">
                    ¿Ya tienes cuenta? Inicia sesión
                </a>
            </div>
            <div class="text-center mt-2 footer-text">© Dotaciones Toronto 2026</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('documento').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            validarCampo(this);
        });
        document.getElementById('telefono').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            validarCampo(this);
        });
        document.getElementById('nombre').addEventListener('input', function() {
            this.value = this.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ\s]/g, '');
            validarCampo(this);
        });
        document.getElementById('correo').addEventListener('input', function() {
            validarCampo(this);
        });
        document.getElementById('direccion').addEventListener('input', function() {
            validarCampo(this);
        });
        document.getElementById('password').addEventListener('input', function() {
            validarCampo(this);
        });
        document.getElementById('rol').addEventListener('change', function() {
            validarCampo(this);
        });

        function validarCampo(campo) {
            if (campo.checkValidity()) {
                campo.classList.remove('is-invalid');
                campo.classList.add('is-valid');
            } else {
                campo.classList.remove('is-valid');
                campo.classList.add('is-invalid');
            }
        }

        document.getElementById('formRegistro').addEventListener('submit', function(e) {
            let valido = true;
            this.querySelectorAll('input, select').forEach(function(campo) {
                validarCampo(campo);
                if (!campo.checkValidity()) valido = false;
            });
            if (!valido) {
                e.preventDefault();
                e.stopPropagation();
            }
        });

        // ===== OJO CONTRASEÑA =====
        document.getElementById('togglePassword').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });
    </script>
</body>
</html>
