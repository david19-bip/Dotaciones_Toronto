<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Dotaciones Toronto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url('/images/fondo registro.jpg');  background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    .login-card {
        background: rgba(255, 255, 255, 0.92);
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.25);
        padding: 40px 36px;
        width: 100%;
        max-width: 420px;
    }
    .login-icon { font-size: 3rem; color: #0d6efd; }
    .login-title { font-size: 1.6rem; font-weight: 700; color: #212529; }
    .login-subtitle { color: #6c757d; font-size: 0.9rem; margin-bottom: 24px; }
    .form-control {
        border-radius: 8px;
        padding: 10px 14px;
        border: 1.5px solid #dee2e6;
    }
    .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 3px rgba(13,110,253,0.10);
    }
    .btn-login {
        border-radius: 8px;
        padding: 11px;
        font-weight: 600;
        font-size: 1rem;
    }
    .footer-text { color: #adb5bd; font-size: 0.8rem; }
</style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-3">
            <i class="bi bi-buildings login-icon"></i>
            <div class="login-title mt-2">Dotaciones Toronto</div>
            <div class="login-subtitle">Crear nueva cuenta</div>
        </div>

        <div th:if="${error}" class="alert alert-danger p-2 fs-6" th:text="${error}"></div>
        <div th:if="${exito}" class="alert alert-success p-2 fs-6" th:text="${exito}"></div>

        <form th:action="@{/registro}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Nombre</label>
                <input type="text" name="nombre" class="form-control"
                       placeholder="Ingrese su nombre" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Documento</label>
                <input type="text" name="documento" class="form-control"
                       placeholder="Ingrese su documento" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Correo electrónico</label>
                <input type="email" name="correo" class="form-control"
                       placeholder="correo@ejemplo.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Teléfono</label>
                <input type="text" name="telefono" class="form-control"
                       placeholder="Ingrese su teléfono" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Dirección</label>
                <input type="text" name="direccion" class="form-control"
                       placeholder="Ingrese su dirección" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" name="password" class="form-control"
                       placeholder="••••••••" required>
            </div>
            <div class="mb-4">
    <label class="form-label fw-semibold">Rol</label>
    <select name="rol" class="form-control" required>
        <option value="">Seleccione un rol</option>
        <option value="2">Cliente</option>
        <option value="3">Vendedor</option>
        <option value="4">Bodeguero</option>
        <option value="1">Admin</option>
    </select>
</div>
            <button type="submit" class="btn btn-primary btn-login w-100">
                <i class="bi bi-person-plus me-1"></i> Registrarse
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/login" class="text-decoration-none text-secondary" style="font-size:0.9rem;">
                ¿Ya tienes cuenta? Inicia sesión
            </a>
        </div>
        <div class="text-center mt-3 footer-text">© Dotaciones Toronto 2026</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
