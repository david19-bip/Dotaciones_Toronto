<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Pedidos - Dotaciones Toronto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/cliente.css}" rel="stylesheet">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand" style="text-align: center; padding: 15px 0;">
            <img th:src="@{/images/logo blanco.png}"
                 alt="Logo Dotaciones Toronto"
                 style="width: 140px; height: 140px; object-fit: contain; display: block; margin: 0 auto 5px;">
            <div style="color: #fa813b; font-weight: 700; font-size: 0.9rem;">Dotaciones Toronto</div>
        </div>
        <a href="/cliente/panel"><i class="bi bi-house"></i> Inicio</a>
        <a href="/cliente/perfil"><i class="bi bi-person"></i> Perfil</a>
        <a href="/cliente/productos"><i class="bi bi-bag"></i> Productos</a>
        <a href="/cliente/pedidos" class="active"><i class="bi bi-receipt"></i> Pedidos</a>
        <a href="/cliente/devoluciones"><i class="bi bi-arrow-return-left"></i> Devoluciones</a>
        <a href="/cliente/nosotros"><i class="bi bi-info-circle"></i> Nosotros</a>
        <form th:action="@{/logout}" method="post" style="padding: 10px 20px; margin-top: 10px;">
            <button type="submit" style="background:none; border:none; color:#f87171; cursor:pointer; font-size:0.9rem; padding:0;">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </button>
        </form>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <h4 class="fw-bold mb-1">Mis pedidos</h4>
        <p class="text-muted mb-4">Consulta el estado de tus pedidos realizados, <span th:text="${nombre}"></span></p>

        <div th:if="${exito}" class="alert alert-success p-2 fs-6" th:text="${exito}"></div>
        <div th:if="${error}" class="alert alert-danger p-2 fs-6" th:text="${error}"></div>

        <div class="card-stat p-3">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr class="text-muted" style="font-size:0.85rem;">
                            <th>Pedido</th>
                            <th>Fecha</th>
                            <th>Cantidad</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pedido : ${pedidos}">
                            <td class="fw-semibold" th:text="'PED-' + ${pedido.id}"></td>
                            <td th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy')}"></td>
                            <td th:text="${pedido.cantidadProductos} + ' productos'"></td>
                            <td th:text="'$ ' + ${#numbers.formatDecimal(pedido.total, 0, 'POINT', 0, 'NONE')}"></td>
                            <td>
                                <span class="badge-estado"
                                      th:classappend="${pedido.estado == 'Pendiente' ? 'badge-pendiente' : (pedido.estado == 'En proceso' ? 'badge-proceso' : (pedido.estado == 'Entregado' ? 'badge-entregado' : 'badge-cancelado'))}"
                                      th:text="${pedido.estado}"></span>
                            </td>
                            <td>
                                <a href="#" class="text-decoration-none" th:onclick="'verDetalle(' + ${pedido.id} + '); return false;'">Ver detalle</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pedidos)}">
                            <td colspan="6" class="text-center text-muted py-4">Aún no tienes pedidos realizados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal detalle de pedido -->
    <div class="modal fade" id="modalDetalle" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalDetalleTitulo">Detalle del pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-sm mb-0">
                        <thead>
                            <tr class="text-muted small">
                                <th>Producto</th>
                                <th>Cant.</th>
                                <th>Precio</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="modalDetalleBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function formatoMoneda(valor) {
            return '$ ' + Number(valor).toLocaleString('es-CO', { maximumFractionDigits: 0 });
        }

        async function verDetalle(idPedido) {
            document.getElementById('modalDetalleTitulo').textContent = 'Detalle del pedido PED-' + idPedido;
            const body = document.getElementById('modalDetalleBody');
            body.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Cargando...</td></tr>';

            const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalDetalle'));
            modal.show();

            try {
                const resp = await fetch('/cliente/pedidos/' + idPedido + '/detalle');
                const items = await resp.json();
                if (!items.length) {
                    body.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Sin productos registrados.</td></tr>';
                    return;
                }
                body.innerHTML = items.map(item => `
                    <tr>
                        <td>${item.producto}</td>
                        <td>${item.cantidad}</td>
                        <td>${formatoMoneda(item.precioUnitario)}</td>
                        <td>${formatoMoneda(item.subtotal)}</td>
                    </tr>
                `).join('');
            } catch (e) {
                body.innerHTML = '<tr><td colspan="4" class="text-center text-danger">No se pudo cargar el detalle.</td></tr>';
            }
        }
    </script>
</body>
</html>
