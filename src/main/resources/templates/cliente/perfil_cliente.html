<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devoluciones - Dotaciones Toronto</title>
    <!-- Estilos Externos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/cliente.css}" rel="stylesheet">
    <link th:href="@{/css/loader.css}" rel="stylesheet">
</head>
<body>

        <!-- LOADER -->
    <div id="loader-overlay">
        <div class="loader-box">
            <div class="loader-logo-wrapper">
                <div class="loader-ring"></div>
                <img th:src="@{/images/logo negro.png}" alt="Logo">
            </div>
            <div class="loader-text">Cargando...</div>
        </div>
    </div>
    <!-- Sidebar -->
    <div class="sidebar">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img th:src="@{/images/logo blanco.png}" alt="Logo Dotaciones Toronto" class="brand-logo">
            <div class="brand-title">DOTACIONES TORONTO</div>
        </div>

        <nav class="sidebar-nav">
            <a href="/cliente/panel"><i class="bi bi-grid-1x2-fill"></i> Inicio</a>
            <a href="/cliente/perfil"class="active"><i class="bi bi-person-bounding-box"></i> Perfil</a>
            <a href="/cliente/productos"><i class="bi bi-bag-check-fill"></i> Productos</a>
            <a href="/cliente/pedidos"><i class="bi bi-receipt-cutoff"></i> Pedidos</a>
            <a href="/cliente/devoluciones"><i class="bi bi-arrow-counterclockwise"></i> Devoluciones</a>
        </nav>
        <form th:action="@{/logout}" method="post" class="mt-auto">
            <button type="submit" class="logout-btn">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </button>
        </form>
    </div>
    
    <!-- Contenido principal -->
    <div class="main-content">
        <h4 class="fw-bold text-dark mb-1">Mi Perfil</h4>
        <p class="text-muted mb-4">Bienvenido, <span th:text="${nombre}"></span></p>

        <div class="row g-4">

            <!-- Información actual -->
            <div class="col-md-5">
                <div class="card-stat p-4">
                    <h6 class="fw-bold mb-3"><i class="bi bi-person-circle me-2" style="color:#fa813b;"></i>Información Personal</h6>
                    <div class="mb-2">
                        <small class="text-muted">Nombre</small>
                        <p class="fw-semibold mb-0" th:text="${usuario.nombre}"></p>
                    </div>
                    <hr>
                    <div class="mb-2">
                        <small class="text-muted">Documento</small>
                        <p class="fw-semibold mb-0" th:text="${usuario.documento}"></p>
                    </div>
                    <hr>
                    <div class="mb-2">
                        <small class="text-muted">Correo electrónico</small>
                        <p class="fw-semibold mb-0" th:text="${usuario.correo}"></p>
                    </div>
                    <hr>
                    <div class="mb-2">
                        <small class="text-muted">Teléfono</small>
                        <p class="fw-semibold mb-0" th:text="${usuario.telefono}"></p>
                    </div>
                    <hr>
                    <div class="mb-2">
                        <small class="text-muted">Dirección</small>
                        <p class="fw-semibold mb-0" th:text="${usuario.direccion}"></p>
                    </div>
                </div>
            </div>

            <!-- Formulario de actualización -->
            <div class="col-md-7">
                <div class="card-stat p-4">
                    <h6 class="fw-bold mb-3"><i class="bi bi-pencil me-2" style="color:#fa813b;"></i>Actualizar Información</h6>

                    <div th:if="${exito}" class="alert alert-success p-2 fs-6" th:text="${exito}"></div>

                    <form th:action="@{/cliente/perfil/actualizar}" method="post">
                       <div class="mb-3">
                            <label class="form-label fw-semibold">Correo electrónico</label>
                            <input type="email" name="correo" class="form-control"
                                    th:value="${usuario.correo}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Teléfono</label>
                            <input type="text" name="telefono" class="form-control"
                                    th:value="${usuario.telefono}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Dirección</label>
                            <input type="text" name="direccion" class="form-control"
                                    th:value="${usuario.direccion}">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Nueva Contraseña</label>
                            <input type="password" name="password" class="form-control"
                                    placeholder="Dejar vacío para no cambiar">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-semibold">
                            <i class="bi bi-save me-1"></i> Guardar Cambios
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/loader.js}"></script>

</body>
</html>
