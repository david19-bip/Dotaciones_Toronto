<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas - Dotaciones Toronto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/vendedor.css}" rel="stylesheet">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-buildings me-2"></i>Dotaciones Toronto
        </div>
        <a href="/vendedor/panel"><i class="bi bi-house"></i> Inicio</a>
        <a href="/vendedor/pedidos"><i class="bi bi-bag"></i> Pedidos</a>
        <a href="/vendedor/ventas" class="active"><i class="bi bi-graph-up"></i> Ventas</a>
        <a href="/vendedor/devoluciones"><i class="bi bi-arrow-return-left"></i> Devoluciones</a>
        <a href="/vendedor/perfil"><i class="bi bi-person"></i> Perfil</a>
        <form th:action="@{/logout}" method="post" style="padding: 10px 20px; margin-top: 10px;">
            <button type="submit" style="background:none; border:none; color:#f87171; cursor:pointer; font-size:0.9rem; padding:0;">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </button>
        </form>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <h4 class="fw-bold text-dark mb-1">Historial de Ventas</h4>
        <p class="text-muted mb-4">Bienvenido, <span th:text="${nombre}"></span></p>

        <!-- Tabla de ventas -->
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead style="background-color:#1E293B; color:#F8FAFC;">
                        <tr>
                            <th class="p-3"># Venta</th>
                            <th class="p-3"># Pedido</th>
                            <th class="p-3">Cliente</th>
                            <th class="p-3">Fecha</th>
                            <th class="p-3">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(ventas)}">
                            <td colspan="5" class="text-center p-4 text-muted">No hay ventas registradas</td>
                        </tr>
                        <tr th:each="venta : ${ventas}">
                            <td class="p-3 fw-bold">#<span th:text="${venta.id}"></span></td>
                            <td class="p-3">#<span th:text="${venta.idPedido}"></span></td>
                            <td class="p-3" th:text="${venta.idUsuario}"></td>
                            <td class="p-3" th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="p-3 fw-bold text-success">
                                $<span th:text="${#numbers.formatDecimal(venta.totalPagado, 1, 'COMMA', 0, 'POINT')}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
