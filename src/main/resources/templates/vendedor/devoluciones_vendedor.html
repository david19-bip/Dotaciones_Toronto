<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devoluciones - Dotaciones Toronto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/vendedor.css}" rel="stylesheet">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand" style="text-align: center; padding: 15px 0;">
            <img th:src="@{/images/logo blanco.png}" 
                alt="Logo Dotaciones Toronto" 
                style="width: 200px; height: 200px; object-fit: contain; display: block; margin: 0 auto 5px;">

            <div style="color: #f5c451; font-weight: 700; font-size: 0.9rem;">
                Dotaciones Toronto
            </div>
        </div>
        <a href="/vendedor/panel"><i class="bi bi-house"></i> Inicio</a>
        <a href="/vendedor/perfil"><i class="bi bi-person"></i> Perfil</a>
        <a href="/vendedor/pedidos"><i class="bi bi-bag"></i> Pedidos</a>
        <a href="/vendedor/ventas"><i class="bi bi-graph-up"></i> Ventas</a>
        <a href="/vendedor/devoluciones" class="active"><i class="bi bi-arrow-return-left"></i> Devoluciones</a>
        
        <form th:action="@{/logout}" method="post" style="padding: 10px 20px; margin-top: 10px;">
            <button type="submit" style="background:none; border:none; color:#f87171; cursor:pointer; font-size:0.9rem; padding:0;">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </button>
        </form>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <h4 class="fw-bold text-dark mb-1">Gestión de Devoluciones</h4>
        <p class="text-muted mb-4">Bienvenido, <span th:text="${nombre}"></span></p>

        <!-- Filtros -->
        <div class="d-flex gap-2 mb-3">
            <a href="/vendedor/devoluciones" class="btn btn-sm btn-primary">Todas</a>
            <a href="/vendedor/devoluciones?estado=Pendiente" class="btn btn-sm btn-outline-warning">Pendientes</a>
            <a href="/vendedor/devoluciones?estado=Aprobada" class="btn btn-sm btn-outline-success">Aprobadas</a>
            <a href="/vendedor/devoluciones?estado=Rechazada" class="btn btn-sm btn-outline-danger">Rechazadas</a>
        </div>

        <!-- Tabla de devoluciones -->
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead style="background-color:#1E293B; color:#F8FAFC;">
                        <tr>
                            <th class="p-3"># Devolución</th>
                            <th class="p-3">Cantidad</th>
                            <th class="p-3">Motivo</th>
                            <th class="p-3">Fecha</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(devoluciones)}">
                            <td colspan="6" class="text-center p-4 text-muted">No hay devoluciones registradas</td>
                        </tr>
                        <tr th:each="devolucion : ${devoluciones}">
                            <td class="p-3 fw-bold">#<span th:text="${devolucion.id}"></span></td>
                            <td class="p-3" th:text="${devolucion.cantidad}"></td>
                            <td class="p-3" th:text="${devolucion.motivo}"></td>
                            <td class="p-3" th:text="${devolucion.fechaDevolucion}"></td>
                            <td class="p-3">
                                <span th:class="${'badge ' +
                                    (devolucion.estado == 'Pendiente' ? 'bg-warning text-dark' :
                                    (devolucion.estado == 'Aprobada' ? 'bg-success' : 'bg-danger'))}"
                                    th:text="${devolucion.estado}">
                                </span>
                            </td>
                            <td class="p-3">
                                <form th:action="@{/vendedor/devoluciones/cambiarEstado}" method="post" class="d-flex gap-2">
                                    <input type="hidden" name="idDevolucion" th:value="${devolucion.id}">
                                    <select name="estado" class="form-select form-select-sm" style="width:130px;">
                                        <option value="Pendiente" th:selected="${devolucion.estado == 'Pendiente'}">Pendiente</option>
                                        <option value="Aprobada" th:selected="${devolucion.estado == 'Aprobada'}">Aprobada</option>
                                        <option value="Rechazada" th:selected="${devolucion.estado == 'Rechazada'}">Rechazada</option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-primary">
                                        <i class="bi bi-check"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
