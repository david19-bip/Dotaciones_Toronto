<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Dotaciones Toronto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #e9ebed;
        }

        /* Fondo: la misma imagen, ampliada y difuminada, para llenar toda la pantalla */
        .fondo-borroso {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(25px);
            transform: scale(1.15);
            z-index: 0;
        }

        /* Contenedor principal centrado */
        .contenido {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px;
        }

        /* Imagen nítida: se ajusta a la pantalla sin deformarse ni recortarse */
        .imagen-error {
            max-width: 100%;
            max-height: calc(100vh - 100px);
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body>
    <img class="fondo-borroso" th:src="@{/images/error-404.png}" alt="">

    <div class="contenido">
        <img class="imagen-error" th:src="@{/images/error-404.png}" alt="Página no encontrada 404">
        <a href="/" class="btn btn-dark px-4 py-2 shadow">
            <i class="bi bi-house-door me-1"></i> Volver al inicio
        </a>
    </div>
</body>
</html>
