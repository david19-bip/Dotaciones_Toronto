<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Bodeguero - Dotaciones Toronto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
    <link th:href="@{/css/bodeguero.css}" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand" style="text-align: center; padding: 15px 0;">
            <img th:src="@{/images/logo blanco.png}"
                alt="Logo Dotaciones Toronto"
                style="width: 200px; height: 200px; object-fit: contain; display: block; margin: 0 auto 5px;">

            <div style="color: #f5c451; font-weight: 700; font-size: 0.9rem;">
                Dotaciones Toronto
            </div>
        </div>
        <a href="/bodeguero/panel" class="active"><i class="bi bi-house"></i> Inicio</a>
        <a href="/bodeguero/perfil"><i class="bi bi-person"></i> Perfil</a>
        <a href="/bodeguero/inventario"><i class="bi bi-archive"></i> Inventario</a>
        <form th:action="@{/logout}" method="post" style="padding: 10px 20px; margin-top: 10px;">
            <button type="submit" style="background:none; border:none; color:#f87171; cursor:pointer; font-size:0.9rem; padding:0;">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </button>
        </form>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <h4 class="fw-bold text-dark mb-1">Bienvenido, <span th:text="${nombre}"></span></h4>
        <p class="text-muted mb-4">Panel de bodega del sistema</p>

        <!-- Tarjetas de resumen -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card card-stat p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="icon bg-success bg-opacity-10 text-success">
                            <i class="bi bi-archive"></i>
                        </div>
                        <div>
                            <div class="text-muted" style="font-size:0.8rem;">Registros de Inventario</div>
                            <div class="fw-bold fs-5" th:text="${totalInventario}">0</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="icon bg-danger bg-opacity-10 text-danger">
                            <i class="bi bi-exclamation-triangle"></i>
                        </div>
                        <div>
                            <div class="text-muted" style="font-size:0.8rem;">Stock Bajo</div>
                            <div class="fw-bold fs-5" th:text="${totalStockBajo}">0</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="icon bg-primary bg-opacity-10 text-primary">
                            <i class="bi bi-box"></i>
                        </div>
                        <div>
                            <div class="text-muted" style="font-size:0.8rem;">Productos</div>
                            <div class="fw-bold fs-5" th:text="${totalProductos}">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Accesos rápidos -->
        <div class="row g-3">
            <div class="col-md-6">
                <div class="card card-stat p-4 text-center">
                    <i class="bi bi-archive fs-1 text-success mb-2"></i>
                    <h6 class="fw-bold">Gestionar Inventario</h6>
                    <p class="text-muted small">Actualizar existencias y niveles de stock</p>
                    <a href="/bodeguero/inventario" class="btn btn-success btn-sm">Ir a Inventario</a>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card card-stat p-4 text-center">
                    <i class="bi bi-person fs-1 text-primary mb-2"></i>
                    <h6 class="fw-bold">Mi Perfil</h6>
                    <p class="text-muted small">Ver y actualizar mi información personal</p>
                    <a href="/bodeguero/perfil" class="btn btn-primary btn-sm">Ir a Perfil</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
