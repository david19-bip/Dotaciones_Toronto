<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Dotaciones Toronto</title>
    <!-- Fuente moderna Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
    <link th:href="@{/css/bodeguero.css}" rel="stylesheet">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand text-center py-3 mb-2">
            <img th:src="@{/images/logo blanco.png}" 
                alt="Logo Dotaciones Toronto" 
                style="width: 140px; height: auto; object-fit: contain; display: block; margin: 0 auto 10px;">

            <!-- Etiqueta BODEGUERO arriba de Dotaciones Toronto -->
            <div class="text-uppercase tracking-wider fw-bold text-success" style="font-size: 0.75rem; letter-spacing: 1.5px;">
                BODEGUERO
            </div>
            <div class="fw-bold" style="color: #f5c451; font-size: 0.95rem;">
                Dotaciones Toronto
            </div>
        </div>

        <a href="/bodeguero/panel"><i class="bi bi-house me-2"></i> Inicio</a>
        <a href="/bodeguero/perfil" class="active"><i class="bi bi-person me-2"></i> Perfil</a>
        <a href="/bodeguero/inventario"><i class="bi bi-archive me-2"></i> Inventario</a>

        <!-- Botón de logout fijado en la parte inferior -->
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="logout-btn">
                <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
            </button>
        </form>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <h4 class="fw-bold text-dark mb-1">Mi Perfil</h4>
        <p class="text-muted mb-4">Bienvenido, <span th:text="${nombre}"></span></p>

        <div class="row g-4">

            <!-- Información actual -->
            <div class="col-md-5">
                <div class="card border-0 shadow-sm rounded-3 p-4">
                    <h6 class="fw-bold mb-3"><i class="bi bi-person-circle me-2 text-primary"></i>Información Personal</h6>
                    <div class="mb-2">
                        <small class="text-muted">Nombre</small>
                        <p class="fw-semibold mb-0" th:text="${usuario.nombre}"></p>
                    </div>
                    <hr>
                    <div class="mb-2">
                        <small class="text-muted">Documento</small>
                        <p class="fw-semibold mb-0" th:text="${usuario.documento}"></p>
                    </div>
                    <hr>
                    <div class="mb-2">
                        <small class="text-muted">Correo electrónico</small>
                        <p class="fw-semibold mb-0" th:text="${usuario.correo}"></p>
                    </div>
                    <hr>
                    <div class="mb-2">
                        <small class="text-muted">Teléfono</small>
                        <p class="fw-semibold mb-0" th:text="${usuario.telefono}"></p>
                    </div>
                    <hr>
                    <div class="mb-2">
                        <small class="text-muted">Dirección</small>
                        <p class="fw-semibold mb-0" th:text="${usuario.direccion}"></p>
                    </div>
                </div>
            </div>

            <!-- Formulario de actualización -->
            <div class="col-md-7">
                <div class="card border-0 shadow-sm rounded-3 p-4">
                    <h6 class="fw-bold mb-3"><i class="bi bi-pencil me-2 text-primary"></i>Actualizar Información</h6>

                    <div th:if="${exito}" class="alert alert-success p-2 fs-6" th:text="${exito}"></div>

                    <form th:action="@{/bodeguero/perfil/actualizar}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input type="text" name="nombre" class="form-control"
                                   th:placeholder="${usuario.nombre}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Correo electrónico</label>
                            <input type="email" name="correo" class="form-control"
                                   th:placeholder="${usuario.correo}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Teléfono</label>
                            <input type="text" name="telefono" class="form-control"
                                   th:placeholder="${usuario.telefono}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Dirección</label>
                            <input type="text" name="direccion" class="form-control"
                                   th:placeholder="${usuario.direccion}">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Nueva Contraseña</label>
                            <input type="password" name="password" class="form-control"
                                   placeholder="Dejar vacío para no cambiar">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-semibold">
                            <i class="bi bi-save me-1"></i> Guardar Cambios
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
