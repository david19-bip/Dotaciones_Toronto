# Nombre logico de la aplicacion (usado por Spring Boot internamente, por ejemplo en logs).
spring.application.name=dotacionestoronto

# configuracion de la base de  datos MySQL
# URL de conexion JDBC a la base de datos local "dotacionestoronto".
# Nota: el parametro final de la URL aparece cortado ("&allowpublickeyR"),
# tal como esta en el archivo original; no se modifico su contenido.
spring.datasource.url=jdbc:mysql://localhost:3306/dotacionestoronto?useSSL=false&serverTimezone=UTC&allowpublickeyR
# Usuario de MySQL (por defecto, root de un entorno local de desarrollo).
spring.datasource.username=root
# Contrasena de MySQL (vacia = sin contrasena; pensado solo para desarrollo local).
spring.datasource.password=
# Configuracion de JPA / Hibernate
# No genera ni actualiza el esquema automaticamente: la base de datos y sus
# tablas deben existir de antemano (creadas manualmente o por script externo).
spring.jpa.hibernate.ddl-auto=none
# Muestra en consola cada sentencia SQL ejecutada por Hibernate (util para depurar).
spring.jpa.show-sql=true
# Formatea el SQL mostrado en consola para que sea mas legible.
spring.jpa.properties.hibernate.format_sql=true
# Dialecto SQL especifico de MySQL usado por Hibernate para traducir las consultas JPA.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Carpeta del classpath desde donde se sirven los recursos estaticos (CSS, JS, imagenes fijas).
spring.web.resources.static-locations=classpath:/static/
# Habilita la subida de archivos (multipart), usada por ejemplo al cargar imagenes de productos.
spring.servlet.multipart.enabled=true
# Tamano maximo permitido para un solo archivo subido.
spring.servlet.multipart.max-file-size=10MB
# Tamano maximo permitido para el total de una peticion multipart (todos los archivos juntos).
spring.servlet.multipart.max-request-size=10MB
# Desactiva el cache de plantillas Thymeleaf, para ver los cambios de las vistas
# sin reiniciar la aplicacion (recomendado solo en desarrollo).
spring.thymeleaf.cache=false
