spring.application.name=dotacionestoronto

# configuracion de la base de  datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/dotacionestoronto?useSSL=false&serverTimezone=UTC&allowpublickeyR
spring.datasource.username=root
spring.datasource.password=
# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.thymeleaf.cache=false

# =====================================================================
#  FACTURACIÓN ELECTRÓNICA - DIAN
#  Documentación completa en FACTURACION_DIAN.md
# =====================================================================

# Interruptor general y canal: SIMULADO | DIAN | PROVEEDOR
facturacion.habilitada=true
facturacion.modo=SIMULADO
# Emite la factura automáticamente al marcar el pedido como "Entregado"
facturacion.emision-automatica=true
# 1 = Producción, 2 = Pruebas / habilitación
facturacion.ambiente=2
# Crea las tablas del módulo al arrancar (false si prefiere ejecutar el SQL a mano)
facturacion.auto-crear-tablas=true

# ------------------ Datos del emisor (CAMBIAR POR LOS REALES) ------------------
facturacion.emisor.nit=900123456
facturacion.emisor.digito-verificacion=
facturacion.emisor.razon-social=DOTACIONES TORONTO S.A.S.
facturacion.emisor.nombre-comercial=Dotaciones Toronto
facturacion.emisor.direccion=CL 1 # 1 - 1
facturacion.emisor.ciudad=Bogotá D.C.
facturacion.emisor.ciudad-codigo=11001
facturacion.emisor.departamento=Bogotá D.C.
facturacion.emisor.departamento-codigo=11
facturacion.emisor.telefono=3000000000
facturacion.emisor.correo=facturacion@dotacionestoronto.com
# 48 = Responsable de IVA | 49 = No responsable de IVA
facturacion.emisor.regimen=48
facturacion.emisor.responsabilidades=O-13,O-15,O-23
facturacion.emisor.actividad-economica=4641
facturacion.emisor.fabricante-software=Dotaciones Toronto

# ------------------ Numeración autorizada por la DIAN ------------------
facturacion.numeracion.prefijo=DT
facturacion.numeracion.desde=1
facturacion.numeracion.hasta=5000
facturacion.numeracion.consecutivo-actual=0
facturacion.numeracion.clave-tecnica=fc8eac422eba16e22ffd8c6f94b3f40a6e38162c
facturacion.numeracion.resolucion-numero=18760000001
facturacion.numeracion.vigencia-desde=2025-01-01
facturacion.numeracion.vigencia-hasta=2027-12-31
# Semilla del set de pruebas de habilitación (dejarla vacía en producción)
facturacion.numeracion.test-set-id=

# ------------------ Impuestos ------------------
facturacion.impuestos.iva-porcentaje=19
# true = los precios de los productos ya incluyen IVA (se desagrega en la factura)
facturacion.impuestos.precios-incluyen-iva=true
facturacion.impuestos.forma-pago=1
facturacion.impuestos.medio-pago=10
facturacion.impuestos.unidad-medida=94

# ------------------ DIAN (transmisión directa) ------------------
facturacion.dian.url-habilitacion=https://vpfe-hab.dian.gov.co/WcfDianCustomerServices.svc
facturacion.dian.url-produccion=https://vpfe.dian.gov.co/WcfDianCustomerServices.svc
facturacion.dian.software-id=00000000-0000-0000-0000-000000000000
facturacion.dian.software-pin=00000
facturacion.dian.software-nombre=Dotaciones Toronto
# Certificado digital .p12 (file:C:/ruta/firma.p12 o classpath:certificado/firma.p12)
facturacion.dian.certificado-ruta=
facturacion.dian.certificado-password=
facturacion.dian.certificado-alias=
facturacion.dian.timeout-segundos=60

# ------------------ Proveedor tecnológico (opcional) ------------------
facturacion.proveedor.url-base=
facturacion.proveedor.token=
facturacion.proveedor.ruta-emision=/api/v1/invoices
facturacion.proveedor.ruta-consulta=/api/v1/invoices/{trackId}
