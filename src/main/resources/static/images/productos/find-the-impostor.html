<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Find the Impostor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151d;
    --bg-alt:#181c26;
    --surface:#1c212e;
    --surface-2:#252b3b;
    --border:#333b52;
    --text:#eef0f5;
    --text-muted:#8a92a8;
    --green:#43d9a3;
    --green-dim:rgba(67,217,163,.13);
    --coral:#f2536b;
    --coral-dim:rgba(242,83,107,.13);
    --amber:#ffb454;
    --amber-dim:rgba(255,180,84,.13);
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'Space Grotesk', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #1a2030 0%, transparent 45%),
      radial-gradient(circle at 85% 100%, #1a1f2c 0%, transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  #app{width:100%;max-width:440px;}

  .window{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.55);
  }
  .window-bar{
    display:flex;
    align-items:center;
    gap:7px;
    padding:12px 16px;
    background:var(--bg-alt);
    border-bottom:1px solid var(--border);
  }
  .dot{width:9px;height:9px;border-radius:50%;}
  .dot.c{background:var(--coral);}
  .dot.a{background:var(--amber);}
  .dot.g{background:var(--green);}
  .window-title{
    margin-left:8px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
  }
  .window-body{padding:30px 26px 28px;}

  h1,h2,h3{margin:0;font-family:var(--sans);font-weight:700;}
  p{margin:0;line-height:1.55;}

  /* ---------- Setup ---------- */
  .setup-title{font-family:var(--mono);font-size:14px;color:var(--amber);margin-bottom:6px;}
  .setup-heading{font-size:26px;line-height:1.25;margin-bottom:14px;}
  .setup-rules{
    font-size:14.5px;
    color:var(--text-muted);
    margin-bottom:24px;
  }
  .setup-rules b{color:var(--text);font-weight:500;}

  .field-label{
    display:block;
    font-size:13px;
    color:var(--text-muted);
    margin:0 0 6px 2px;
  }
  .player-inputs{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;}
  .player-input-row{display:flex;align-items:center;gap:10px;}
  .player-swatch{width:8px;height:24px;border-radius:3px;flex-shrink:0;}
  input[type=text]{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    padding:10px 12px;
    border-radius:8px;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--amber);}

  .chip-row{display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap;}
  .chip{
    font-family:var(--mono);
    font-size:13px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-muted);
    cursor:pointer;
    user-select:none;
  }
  .chip.active{
    border-color:var(--amber);
    color:var(--amber);
    background:var(--amber-dim);
  }

  .btn{
    display:block;
    width:100%;
    text-align:center;
    font-family:var(--sans);
    font-weight:700;
    font-size:15.5px;
    padding:14px 18px;
    border-radius:999px;
    border:none;
    cursor:pointer;
  }
  .btn-primary{background:var(--amber);color:#20160a;}
  .btn-primary:active{transform:translateY(1px);}
  .btn-outline{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-muted);
    font-weight:500;
  }
  .btn-row{display:flex;gap:10px;margin-top:22px;}
  .btn-row .btn{flex:1;}

  /* ---------- In-game top bar ---------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
  }
  .round-tag{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--text-muted);
  }
  .rules-btn{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    background:transparent;
    border:1px solid var(--border);
    border-radius:999px;
    padding:5px 12px;
    cursor:pointer;
  }

  /* ---------- Pass screen ---------- */
  .stage{
    min-height:280px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
    cursor:pointer;
    padding:10px 4px;
  }
  .pass-label{font-size:14px;color:var(--text-muted);}
  .pass-name{
    font-size:32px;
    font-weight:700;
    line-height:1.2;
    max-width:280px;
  }
  .tap-hint{
    margin-top:10px;
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--text-muted);
  }
  .tap-hint kbd{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:4px;
    padding:2px 7px;
    font-family:var(--mono);
  }
  .pulse{
    width:52px;height:52px;border-radius:50%;
    border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
  }
  @media (prefers-reduced-motion:no-preference){
    .pulse{animation:pulse 1.8s ease-in-out infinite;}
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,180,84,.35);}
    50%{box-shadow:0 0 0 12px rgba(255,180,84,0);}
  }

  /* ---------- Reveal screen ---------- */
  .reveal-wrap{cursor:pointer;}
  @media (prefers-reduced-motion:no-preference){
    .reveal-wrap{animation:reveal-in .35s ease-out;}
  }
  @keyframes reveal-in{
    from{opacity:0;transform:translateY(10px) scale(.98);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  .role-tag{
    display:inline-block;
    font-family:var(--mono);
    font-size:13px;
    font-weight:700;
    letter-spacing:.02em;
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:16px;
  }
  .role-tag.innocent{background:var(--green-dim);color:var(--green);}
  .role-tag.impostor{background:var(--coral-dim);color:var(--coral);}
  .topic-line{font-size:13px;color:var(--text-muted);margin-bottom:10px;}
  .statement{
    font-family:var(--mono);
    font-size:19px;
    line-height:1.5;
    margin-bottom:18px;
  }
  .statement::before{content:"// ";color:var(--text-muted);}
  .pron-line{
    font-family:var(--mono);
    font-size:13.5px;
    font-style:italic;
    color:var(--amber);
    margin-bottom:8px;
  }
  .es-line{font-size:14.5px;color:var(--text-muted);margin-bottom:16px;}
  .hint-line{font-size:13.5px;color:var(--text-muted);margin-bottom:6px;}

  /* ---------- Discuss ---------- */
  .discuss-icon{font-size:34px;}

  /* ---------- Result ---------- */
  .result-title{font-size:22px;margin-bottom:4px;}
  .result-name{color:var(--coral);}
  .recap{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    text-align:left;
  }
  .recap-row{
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    background:var(--surface-2);
  }
  .recap-row.good{border-color:rgba(67,217,163,.35);}
  .recap-row.bad{border-color:rgba(242,83,107,.35);}
  .recap-tag{font-family:var(--mono);font-size:11.5px;margin-bottom:5px;}
  .recap-row.good .recap-tag{color:var(--green);}
  .recap-row.bad .recap-tag{color:var(--coral);}
  .recap-text{font-family:var(--mono);font-size:14.5px;line-height:1.45;margin-bottom:5px;}
  .recap-pron{font-family:var(--mono);font-size:12.5px;font-style:italic;color:var(--amber);margin-bottom:5px;}
  .recap-es{font-size:13px;color:var(--text-muted);}
  .score-line{
    margin-top:18px;
    font-size:13.5px;
    color:var(--text-muted);
    text-align:center;
  }

  /* ---------- End ---------- */
  .end-emoji{font-size:38px;margin-bottom:6px;}
  .end-score{
    font-family:var(--mono);
    font-size:16px;
    color:var(--amber);
    margin:14px 0 26px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(8,10,15,.65);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    z-index:10;
  }
  .modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:24px;
    max-width:380px;
  }
  .modal h3{font-size:17px;margin-bottom:12px;}
  .modal p{font-size:14px;color:var(--text-muted);margin-bottom:10px;}
  .modal p b{color:var(--text);font-weight:500;}

  .center-txt{text-align:center;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const TOPICS = [
  {topic:"Variables",
    verdad:{en:"A variable stores data.", pron:"ei vériable stors déita", es:"Una variable almacena datos."},
    falso:{en:"A variable deletes data.", pron:"ei vériable dilíts déita", es:"Una variable elimina datos."}},
  {topic:"Loops",
    verdad:{en:"A loop repeats code.", pron:"ei lup ripíts cóud", es:"Un bucle repite código."},
    falso:{en:"A loop deletes code.", pron:"ei lup dilíts cóud", es:"Un bucle elimina código."}},
  {topic:"Functions",
    verdad:{en:"A function can return a value.", pron:"ei fánkshon can ritérn ei váliu", es:"Una función puede devolver un valor."},
    falso:{en:"A function can delete a value.", pron:"ei fánkshon can dilít ei váliu", es:"Una función puede eliminar un valor."}},
  {topic:"Conditionals",
    verdad:{en:"An if-statement checks a condition.", pron:"an if-stéitment chéks ei condíshon", es:"Un if revisa una condición."},
    falso:{en:"An if-statement ignores a condition.", pron:"an if-stéitment ignórs ei condíshon", es:"Un if ignora una condición."}},
  {topic:"Arrays",
    verdad:{en:"An array stores multiple values.", pron:"an eiréi stors móltipol válius", es:"Un array almacena varios valores."},
    falso:{en:"An array deletes multiple values.", pron:"an eiréi dilíts móltipol válius", es:"Un array elimina varios valores."}},
  {topic:"Strings",
    verdad:{en:"A string is a sequence of characters.", pron:"ei string is ei sícuens of quéracters", es:"Un string es una secuencia de caracteres."},
    falso:{en:"A string is a sequence of numbers.", pron:"ei string is ei sícuens of nómbers", es:"Un string es una secuencia de números."}},
  {topic:"Comments",
    verdad:{en:"A comment is ignored by the computer.", pron:"ei cóment is ignórd bai de compiúter", es:"Un comentario es ignorado por la computadora."},
    falso:{en:"A comment is executed by the computer.", pron:"ei cóment is éksekiutid bai de compiúter", es:"Un comentario es ejecutado por la computadora."}},
  {topic:"Booleans",
    verdad:{en:"A boolean is either true or false.", pron:"ei búlian is íder tru or fols", es:"Un booleano es verdadero o falso."},
    falso:{en:"A boolean is always true or false.", pron:"ei búlian is óluéis tru or fols", es:"Un booleano siempre es verdadero y falso."}},
  {topic:"Classes",
    verdad:{en:"A class is a blueprint for objects.", pron:"ei clas is ei blúprint for óbyects", es:"Una clase es un plano para crear objetos."},
    falso:{en:"A class is a copy of objects.", pron:"ei clas is ei cópi of óbyects", es:"Una clase es una copia de objetos."}},
  {topic:"Operators",
    verdad:{en:"The plus sign adds two numbers.", pron:"de plos sain ads tu nómbers", es:"El signo de más suma dos números."},
    falso:{en:"The plus sign removes two numbers.", pron:"de plos sain rimúvs tu nómbers", es:"El signo de más resta dos números."}},
  {topic:"Input/Output",
    verdad:{en:"Print shows text on the screen.", pron:"print shóus tekst on de scrin", es:"Print muestra texto en la pantalla."},
    falso:{en:"Print hides text on the screen.", pron:"print jaids tekst on de scrin", es:"Print oculta texto en la pantalla."}},
  {topic:"Debugging",
    verdad:{en:"A bug is an error in the code.", pron:"ei bog is an érror in de cóud", es:"Un bug es un error en el código."},
    falso:{en:"A bug is a feature in the code.", pron:"ei bog is ei fícher in de cóud", es:"Un bug es una característica del código."}},
  {topic:"Constants",
    verdad:{en:"A constant cannot change its value.", pron:"ei cónstant cánot chéinch its váliu", es:"Una constante no puede cambiar su valor."},
    falso:{en:"A constant cannot show its value.", pron:"ei cónstant cánot shóu its váliu", es:"Una constante no puede mostrar su valor."}},
  {topic:"Parameters",
    verdad:{en:"A parameter is a function's input.", pron:"ei paráamiter is ei fánkshons ínput", es:"Un parámetro es la entrada de una función."},
    falso:{en:"A parameter is a function's output.", pron:"ei paráamiter is ei fánkshons áutput", es:"Un parámetro es la salida de una función."}},
  {topic:"Loops (while)",
    verdad:{en:"A while-loop repeats until false.", pron:"ei uáil-lup ripíts ontíl fols", es:"Un bucle while se repite hasta que sea falso."},
    falso:{en:"A while-loop repeats until true.", pron:"ei uáil-lup ripíts ontíl tru", es:"Un bucle while se repite hasta que sea verdadero."}},
  {topic:"Errors",
    verdad:{en:"An error stops the program running.", pron:"an érror stops de próugram róning", es:"Un error detiene la ejecución del programa."},
    falso:{en:"An error starts the program running.", pron:"an érror starts de próugram róning", es:"Un error inicia la ejecución del programa."}},
  {topic:"Indentation",
    verdad:{en:"Indentation shows the code's structure.", pron:"indentéishon shóus de cóuds strókcher", es:"La indentación muestra la estructura del código."},
    falso:{en:"Indentation hides the code's structure.", pron:"indentéishon jaids de cóuds strókcher", es:"La indentación oculta la estructura del código."}},
  {topic:"Data Types",
    verdad:{en:"An integer is a whole number.", pron:"an íntoyer is ei jóul nómber", es:"Un entero es un número sin decimales."},
    falso:{en:"An integer is a decimal number.", pron:"an íntoyer is ei désimal nómber", es:"Un entero es un número decimal."}},
  {topic:"Loops (for)",
    verdad:{en:"A for-loop counts a fixed number.", pron:"ei for-lup cáunts ei fíkst nómber", es:"Un bucle for cuenta un número fijo de veces."},
    falso:{en:"A for-loop counts an infinite number.", pron:"ei for-lup cáunts an ínfinit nómber", es:"Un bucle for cuenta un número infinito de veces."}},
  {topic:"Recursion",
    verdad:{en:"Recursion is a function calling itself.", pron:"rikérshon is ei fánkshon cólin itsélf", es:"La recursión es una función que se llama a sí misma."},
    falso:{en:"Recursion is a function deleting itself.", pron:"rikérshon is ei fánkshon dilítin itsélf", es:"La recursión es una función que se elimina a sí misma."}},
  {topic:"Libraries",
    verdad:{en:"A library contains reusable code.", pron:"ei láibreri contéins riúsabol cóud", es:"Una librería contiene código reutilizable."},
    falso:{en:"A library contains broken code.", pron:"ei láibreri contéins bróuken cóud", es:"Una librería contiene código roto."}},
  {topic:"Syntax",
    verdad:{en:"Syntax errors break the program's rules.", pron:"síntaks érrors bréik de próugrams ruls", es:"Los errores de sintaxis rompen las reglas del programa."},
    falso:{en:"Syntax errors follow the program's rules.", pron:"síntaks érrors fólou de próugrams ruls", es:"Los errores de sintaxis siguen las reglas del programa."}},
  {topic:"Algorithms",
    verdad:{en:"An algorithm solves a problem step-by-step.", pron:"an álgoridm solvs ei próblem step-bai-step", es:"Un algoritmo resuelve un problema paso a paso."},
    falso:{en:"An algorithm solves a problem instantly.", pron:"an álgoridm solvs ei próblem instántli", es:"Un algoritmo resuelve un problema al instante."}},
  {topic:"Compilers",
    verdad:{en:"A compiler translates code into machine language.", pron:"ei compáiler transléits cóud íntu mashín lánguich", es:"Un compilador traduce código a lenguaje máquina."},
    falso:{en:"A compiler deletes code into machine language.", pron:"ei compáiler dilíts cóud íntu mashín lánguich", es:"Un compilador elimina código en lenguaje máquina."}}
];

const SWATCH = ["#ffb454","#43d9a3","#f2536b"];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function randInt(n){ return Math.floor(Math.random()*n); }

let state = {
  phase:"setup",
  players:["Player 1","Player 2","Player 3"],
  roundCount:24,
  rounds:[],
  roundIndex:0,
  playerOrder:[0,1,2],
  currentPos:0,
  impostorIndex:0,
  found:0,
  playedRounds:0,
  rulesOpen:false
};

const app = document.getElementById("app");

function startGame(){
  const inputs = document.querySelectorAll(".name-input");
  inputs.forEach((inp,i)=>{
    const v = inp.value.trim();
    if(v) state.players[i] = v;
  });
  state.rounds = shuffle(TOPICS).slice(0, state.roundCount);
  state.roundIndex = 0;
  state.found = 0;
  state.playedRounds = 0;
  setupRound();
  state.phase = "pass";
  render();
}

function setupRound(){
  state.playerOrder = [0,1,2]; // turn order is always Player 1, 2, 3
  // pick the impostor fresh each round, at random, independent of turn order
  state.impostorIndex = randInt(3);
  state.currentPos = 0;
}

function primaryAction(){
  if(state.rulesOpen) return;
  if(state.phase === "pass"){
    state.phase = "reveal";
  } else if(state.phase === "reveal"){
    if(state.currentPos < 2){
      state.currentPos++;
      state.phase = "pass";
    } else {
      state.phase = "discuss";
    }
  } else if(state.phase === "discuss"){
    state.phase = "result";
  }
  render();
}

function scoreAndNext(wasFound){
  state.playedRounds++;
  if(wasFound) state.found++;
  state.roundIndex++;
  if(state.roundIndex >= state.rounds.length){
    state.phase = "end";
  } else {
    setupRound();
    state.phase = "pass";
  }
  render();
}

function playAgain(){
  state.phase = "setup";
  render();
}

function toggleRules(){
  state.rulesOpen = !state.rulesOpen;
  render();
}

function setChip(n){
  state.roundCount = n;
  render();
}

document.addEventListener("keydown",(e)=>{
  if(e.code !== "Space") return;
  const tag = document.activeElement.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA") return;
  if(["pass","reveal","discuss"].includes(state.phase)){
    e.preventDefault();
    primaryAction();
  }
});

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function render(){
  let inner = "";

  if(state.phase === "setup"){
    inner = `
      <div class="window">
        <div class="window-bar">
          <span class="dot c"></span><span class="dot a"></span><span class="dot g"></span>
          <span class="window-title">find_the_impostor.js</span>
        </div>
        <div class="window-body">
          <div class="setup-title">// a game of lies</div>
          <h1 class="setup-heading">Find the Impostor</h1>
          <p class="setup-rules">
            Form a group of <b>3 people</b> and pass the phone around. Two players get
            the correct definition of a programming concept; a third player (the impostor) gets a
            similar-looking but false version, without knowing which one is true. Taking turns, everyone
            says their sentence out loud and the group debates who lied.
          </p>

          <label class="field-label">Group names</label>
          <div class="player-inputs">
            ${state.players.map((p,i)=>`
              <div class="player-input-row">
                <span class="player-swatch" style="background:${SWATCH[i]}"></span>
                <input type="text" class="name-input" value="${esc(p)}" placeholder="Player ${i+1}" maxlength="20">
              </div>
            `).join("")}
          </div>

          <label class="field-label">How many topics do you want to play</label>
          <div class="chip-row">
            ${[5,10,15,24].map(n=>`
              <div class="chip ${state.roundCount===n?'active':''}" onclick="setChip(${n})">
                ${n===24? "24 (all)" : n}
              </div>
            `).join("")}
          </div>

          <button class="btn btn-primary" onclick="startGame()">Start game</button>
        </div>
      </div>
    `;
  }

  else if(state.phase === "pass"){
    const idx = state.playerOrder[state.currentPos];
    const name = state.players[idx];
    inner = `
      <div class="window">
        <div class="window-bar">
          <span class="dot c"></span><span class="dot a"></span><span class="dot g"></span>
          <span class="window-title">find_the_impostor.js</span>
        </div>
        <div class="window-body">
          ${topbar()}
          <div class="stage" onclick="primaryAction()">
            <div class="pulse">📱</div>
            <div class="pass-label">Pass the phone to</div>
            <div class="pass-name" style="color:${SWATCH[idx]}">${esc(name)}</div>
            <div class="tap-hint">Tap the screen or press <kbd>space</kbd> to see your role</div>
          </div>
        </div>
      </div>
      ${rulesModal()}
    `;
  }

  else if(state.phase === "reveal"){
    const idx = state.playerOrder[state.currentPos];
    const isImpostor = idx === state.impostorIndex;
    const round = state.rounds[state.roundIndex];
    const item = isImpostor ? round.falso : round.verdad;
    inner = `
      <div class="window">
        <div class="window-bar">
          <span class="dot c"></span><span class="dot a"></span><span class="dot g"></span>
          <span class="window-title">find_the_impostor.js</span>
        </div>
        <div class="window-body">
          ${topbar()}
          <div class="stage reveal-wrap" onclick="primaryAction()" style="min-height:260px;">
            <div>
              <span class="role-tag ${isImpostor?'impostor':'innocent'}">${isImpostor?'IMPOSTOR':'INNOCENT'}</span>
              <div class="topic-line">Topic: ${esc(round.topic)}</div>
              <div class="statement">${esc(item.en)}</div>
              <div class="pron-line">/ ${esc(item.pron)} /</div>
              <div class="es-line">${esc(item.es)}</div>
              <div class="hint-line">
                ${isImpostor
                  ? "It's false. Act like you believe it and don't get caught."
                  : "It's true. Memorize it and don't show the screen to anyone."}
              </div>
            </div>
            <div class="tap-hint" style="margin-top:8px;">Tap or press <kbd>space</kbd> to continue</div>
          </div>
        </div>
      </div>
      ${rulesModal()}
    `;
  }

  else if(state.phase === "discuss"){
    inner = `
      <div class="window">
        <div class="window-bar">
          <span class="dot c"></span><span class="dot a"></span><span class="dot g"></span>
          <span class="window-title">find_the_impostor.js</span>
        </div>
        <div class="window-body">
          ${topbar()}
          <div class="stage" onclick="primaryAction()">
            <div class="discuss-icon">🗣️</div>
            <h2 style="font-size:20px;">Everyone has seen their sentence</h2>
            <p style="color:var(--text-muted);font-size:14.5px;max-width:280px;">
              Taking turns, say your sentence out loud. Then decide together who you think lied.
            </p>
            <div class="tap-hint">Tap or press <kbd>space</kbd> to reveal the impostor</div>
          </div>
        </div>
      </div>
      ${rulesModal()}
    `;
  }

  else if(state.phase === "result"){
    const round = state.rounds[state.roundIndex];
    const impostorName = state.players[state.impostorIndex];
    inner = `
      <div class="window">
        <div class="window-bar">
          <span class="dot c"></span><span class="dot a"></span><span class="dot g"></span>
          <span class="window-title">find_the_impostor.js</span>
        </div>
        <div class="window-body">
          ${topbar()}
          <div class="center-txt">
            <div class="topic-line">Topic: ${esc(round.topic)}</div>
            <h2 class="result-title">The impostor was <span class="result-name">${esc(impostorName)}</span></h2>
          </div>
          <div class="recap">
            <div class="recap-row good">
              <div class="recap-tag">TRUE</div>
              <div class="recap-text">${esc(round.verdad.en)}</div>
              <div class="recap-pron">/ ${esc(round.verdad.pron)} /</div>
              <div class="recap-es">${esc(round.verdad.es)}</div>
            </div>
            <div class="recap-row bad">
              <div class="recap-tag">FALSE (impostor)</div>
              <div class="recap-text">${esc(round.falso.en)}</div>
              <div class="recap-pron">/ ${esc(round.falso.pron)} /</div>
              <div class="recap-es">${esc(round.falso.es)}</div>
            </div>
          </div>
          <div class="btn-row">
            <button class="btn btn-outline" onclick="scoreAndNext(false)">They didn't find them</button>
            <button class="btn btn-primary" onclick="scoreAndNext(true)">They found them</button>
          </div>
          <div class="score-line">Found in ${state.found}/${state.playedRounds} rounds so far</div>
        </div>
      </div>
      ${rulesModal()}
    `;
  }

  else if(state.phase === "end"){
    inner = `
      <div class="window">
        <div class="window-bar">
          <span class="dot c"></span><span class="dot a"></span><span class="dot g"></span>
          <span class="window-title">find_the_impostor.js</span>
        </div>
        <div class="window-body center-txt">
          <div class="end-emoji">🏁</div>
          <h2 style="font-size:22px;">Game over</h2>
          <div class="end-score">You found the impostor in ${state.found} of ${state.playedRounds} rounds</div>
          <button class="btn btn-primary" onclick="playAgain()">Play again</button>
        </div>
      </div>
    `;
  }

  app.innerHTML = inner;
}

function topbar(){
  return `
    <div class="topbar">
      <span class="round-tag">Round ${state.roundIndex+1} of ${state.rounds.length}</span>
      <button class="rules-btn" onclick="toggleRules()">Rules</button>
    </div>
  `;
}

function rulesModal(){
  if(!state.rulesOpen) return "";
  return `
    <div class="overlay" onclick="if(event.target===this) toggleRules()">
      <div class="modal">
        <h3>How to play</h3>
        <p>Play in groups of <b>3 people</b>, passing around a single phone.</p>
        <p>Each round, two players get a <b>true</b> sentence about a programming concept. The third player, the <b>impostor</b>, gets a similar-looking but <b>false</b> sentence, and doesn't know which one is correct.</p>
        <p>Taking turns, everyone says their sentence out loud without showing the screen. Then the group discusses and votes on who they think lied.</p>
        <p>At the end of each round, the real impostor is revealed.</p>
        <button class="btn btn-outline" onclick="toggleRules()">Close</button>
      </div>
    </div>
  `;
}

render();
</script>
</body>
</html>
